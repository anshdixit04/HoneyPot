# Production/VPS deployment. Do not run this on your home network.
#
# Cowrie is public here, but the backend is not. The frontend container serves
# the static dashboard and proxies /api + /ws to the private backend network.
# Apply infra/iptables-honeypot-egress.sh on the VPS after the stack starts
# and before opening traffic broadly.

services:
  cowrie:
    # Pinned by digest (the build deployed 2026-07) so a rebuild can't
    # silently pull a new Cowrie. Bump deliberately.
    image: cowrie/cowrie@sha256:b4817f185e522f5a66975568ff304ae02c042b65454c2542918f42dbaf1b31fa
    container_name: honeypot-cowrie
    # Cowrie reads COWRIE_<SECTION>_<OPTION> env vars as cowrie.cfg overrides.
    # The stock hostname (svr04) and Debian identity are on public
    # honeypot-detection lists; these match the real Ubuntu 24.04 host instead.
    environment:
      COWRIE_HONEYPOT_HOSTNAME: web-prod-02
      COWRIE_SSH_VERSION: SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.19
      COWRIE_SHELL_KERNEL_VERSION: 6.8.0-124-generic
      COWRIE_SHELL_KERNEL_BUILD_STRING: "#124-Ubuntu SMP PREEMPT_DYNAMIC Tue May 26 13:00:45 UTC 2026"
      # Off by default in the image, even though port 2223 is published below.
      COWRIE_TELNET_ENABLED: "yes"
    ports:
      - "${HONEYPOT_BIND_IP:-0.0.0.0}:${HONEYPOT_SSH_PORT:-2222}:2222"
      - "${HONEYPOT_BIND_IP:-0.0.0.0}:${HONEYPOT_TELNET_PORT:-2223}:2223"
    volumes:
      - cowrie_logs:/cowrie/cowrie-git/var/log/cowrie
      # Session recordings, shared with the backend for replay. Not
      # mounted read-only here or below: the backend's retention loop
      # (docs/02-design-doc.md section 9.5) prunes old files from its side.
      - cowrie_tty:/cowrie/cowrie-git/var/lib/cowrie/tty
    restart: unless-stopped
    networks:
      cowrie_net:
        # Fixed so the egress firewall rule (infra/iptables-honeypot-egress.sh,
        # applied at boot by infra/honeypot-egress.service) always matches.
        ipv4_address: 172.19.0.2
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  backend:
    build:
      context: ../backend
    container_name: honeypot-backend
    environment:
      COWRIE_LOG_PATH: /var/log/cowrie/cowrie.json
      HONEYPOT_DB_PATH: /data/honeypot.db
      TTYLOG_DIR: /var/lib/cowrie-tty
      TTYLOG_RETENTION_DAYS: "${TTYLOG_RETENTION_DAYS:-14}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    volumes:
      - cowrie_logs:/var/log/cowrie:ro
      - cowrie_tty:/var/lib/cowrie-tty
      - honeypot_data:/data
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - dashboard_net
    depends_on:
      - cowrie

  frontend:
    build:
      context: ../frontend
    container_name: honeypot-dashboard
    ports:
      - "${DASHBOARD_BIND_IP:-0.0.0.0}:${DASHBOARD_HTTP_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - dashboard_net
    depends_on:
      - backend

networks:
  cowrie_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
  dashboard_net:
    driver: bridge

volumes:
  cowrie_logs:
  cowrie_tty:
  honeypot_data:
